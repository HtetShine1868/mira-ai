<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mira AI – Backend Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0a12;
      color: #e2e2f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 36px;
    }

    .card {
      background: #13131f;
      border: 1px solid #2a2a40;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 640px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #a78bfa;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="file"] {
      display: none;
    }

    .upload-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px dashed #3a3a55;
      border-radius: 12px;
      padding: 32px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: #0d0d1a;
    }

    .upload-label:hover {
      border-color: #a78bfa;
      background: #1a1a2e;
    }

    .upload-label .icon { font-size: 2.5rem; margin-bottom: 10px; }
    .upload-label .hint { font-size: 0.85rem; color: #6b7280; margin-top: 4px; }

    #file-name {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #38bdf8;
      min-height: 20px;
      text-align: center;
    }

    #preview-img {
      display: none;
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      border-radius: 8px;
      margin-top: 16px;
      border: 1px solid #2a2a40;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 20px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: #fff;
      letter-spacing: 0.03em;
    }

    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .status-bar {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #6b7280;
      text-align: center;
      min-height: 20px;
    }

    .status-bar.loading { color: #f59e0b; }
    .status-bar.error   { color: #ef4444; }
    .status-bar.success { color: #22c55e; }

    /* Result card */
    #result-card { display: none; }

    .risk-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    .risk-Critical { background: #7f1d1d; color: #fca5a5; }
    .risk-High     { background: #78350f; color: #fcd34d; }
    .risk-Medium   { background: #713f12; color: #fde68a; }
    .risk-Low      { background: #14532d; color: #86efac; }
    .risk-Safe     { background: #064e3b; color: #6ee7b7; }

    .report-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .report-item label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7280;
      display: block;
      margin-bottom: 3px;
    }

    .report-item span {
      font-size: 0.9rem;
      font-weight: 600;
      color: #e2e2f0;
    }

    .confidence-bar-wrap {
      background: #1e1e30;
      border-radius: 4px;
      height: 6px;
      margin-top: 6px;
      overflow: hidden;
    }

    .confidence-bar {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #7c3aed, #38bdf8);
      transition: width 1s ease;
    }

    .section-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7280;
      margin: 16px 0 8px;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      background: #1e1e30;
      border: 1px solid #2a2a40;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.78rem;
      color: #c4c4e0;
    }

    .explanation-box {
      background: #0d0d1a;
      border-left: 3px solid #7c3aed;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 0.87rem;
      line-height: 1.6;
      color: #c4c4e0;
      margin: 8px 0 16px;
    }

    .actions-list {
      list-style: none;
      padding: 0;
    }

    .actions-list li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.85rem;
      color: #c4c4e0;
      margin-bottom: 6px;
      line-height: 1.5;
    }

    .actions-list li::before {
      content: '→';
      color: #38bdf8;
      flex-shrink: 0;
    }

    .severity-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .sev-item {
      background: #0d0d1a;
      border: 1px solid #2a2a40;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }

    .sev-item label {
      font-size: 0.68rem;
      text-transform: uppercase;
      color: #6b7280;
      display: block;
      margin-bottom: 4px;
      letter-spacing: 0.06em;
    }

    .sev-item span { font-size: 0.85rem; font-weight: 700; }
    .sev-High      { color: #f87171; }
    .sev-Medium    { color: #fcd34d; }
    .sev-Low       { color: #86efac; }
    .sev-None      { color: #6b7280; }
    .sev-Immediate { color: #f87171; }
    .sev-Moderate  { color: #fcd34d; }

    pre {
      background: #0d0d1a;
      border: 1px solid #2a2a40;
      border-radius: 8px;
      padding: 14px;
      font-size: 0.78rem;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      color: #a5b4fc;
      margin-top: 8px;
    }

    details summary {
      cursor: pointer;
      font-size: 0.8rem;
      color: #6b7280;
      margin-top: 16px;
      user-select: none;
    }

    details summary:hover { color: #a78bfa; }

    .safe-icon   { font-size: 3rem; text-align: center; margin-bottom: 8px; }
    .threat-icon { font-size: 3rem; text-align: center; margin-bottom: 8px; }
  </style>
</head>
<body>

  <h1>🛡️ Mira AI — Backend Test</h1>
  <p class="subtitle">Upload any screenshot to test the cybersecurity analysis pipeline</p>

  <!-- Upload Card -->
  <div class="card">
    <h2>📤 Screenshot Upload</h2>

    <label class="upload-label" for="image-input">
      <span class="icon">🖼️</span>
      <strong>Click to choose an image</strong>
      <span class="hint">JPEG · PNG · WEBP · GIF &nbsp;|&nbsp; Max 5 MB</span>
    </label>
    <input type="file" id="image-input" accept="image/jpeg,image/png,image/webp,image/gif" />

    <div id="file-name">No file selected</div>
    <img id="preview-img" alt="preview" />

    <button class="btn" id="analyze-btn" disabled>🔍 Analyze Screenshot</button>
    <div class="status-bar" id="status"></div>
  </div>

  <!-- Result Card -->
  <div class="card" id="result-card">
    <h2>🔒 Security Report</h2>

    <div id="safe-icon" class="safe-icon" style="display:none">✅</div>
    <div id="threat-icon" class="threat-icon" style="display:none">⚠️</div>

    <div id="risk-badge-wrap"></div>

    <div class="report-grid">
      <div class="report-item">
        <label>Attack Type</label>
        <span id="r-attack-type">—</span>
      </div>
      <div class="report-item">
        <label>Confidence</label>
        <span id="r-confidence">—</span>
        <div class="confidence-bar-wrap">
          <div class="confidence-bar" id="r-confidence-bar" style="width:0%"></div>
        </div>
      </div>
    </div>

    <div class="section-title">🚩 Indicators Detected</div>
    <div class="tag-list" id="r-indicators"></div>

    <div class="section-title">📝 Explanation</div>
    <div class="explanation-box" id="r-explanation"></div>

    <div class="section-title">✅ Recommended Actions</div>
    <ul class="actions-list" id="r-actions"></ul>

    <div class="section-title">🎯 Affected Elements</div>
    <div class="tag-list" id="r-elements"></div>

    <div class="section-title">📊 Severity Breakdown</div>
    <div class="severity-grid" id="r-severity"></div>

    <details>
      <summary>View raw JSON response</summary>
      <pre id="r-raw"></pre>
    </details>
  </div>

  <script>
    const fileInput  = document.getElementById('image-input');
    const fileNameEl = document.getElementById('file-name');
    const previewImg = document.getElementById('preview-img');
    const analyzeBtn = document.getElementById('analyze-btn');
    const statusEl   = document.getElementById('status');
    const resultCard = document.getElementById('result-card');

    // ── File selection ────────────────────────────────────────────────────────
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;

      fileNameEl.textContent = `${file.name}  (${(file.size / 1024).toFixed(1)} KB)`;
      analyzeBtn.disabled = false;

      const reader = new FileReader();
      reader.onload = e => {
        previewImg.src = e.target.result;
        previewImg.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    // ── Analyze ───────────────────────────────────────────────────────────────
    analyzeBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) return;

      analyzeBtn.disabled = true;
      resultCard.style.display = 'none';
      statusEl.className = 'status-bar loading';
      statusEl.textContent = '⏳ Sending screenshot to Mira backend…';

      const formData = new FormData();
      formData.append('image', file);

      try {
        const res  = await fetch('http://localhost:5000/api/analyze', { method: 'POST', body: formData });
        const json = await res.json();

        if (!json.success) throw new Error(json.error || 'Unknown error from backend');

        statusEl.className = 'status-bar success';
        statusEl.textContent = '✅ Analysis complete!';

        renderReport(json.data);

      } catch (err) {
        statusEl.className = 'status-bar error';
        statusEl.textContent = '❌ Error: ' + err.message;
      } finally {
        analyzeBtn.disabled = false;
      }
    });

    // ── Render ────────────────────────────────────────────────────────────────
    function renderReport(data) {
      resultCard.style.display = 'block';
      resultCard.scrollIntoView({ behavior: 'smooth' });

      document.getElementById('safe-icon').style.display   = data.isSafe ? 'block' : 'none';
      document.getElementById('threat-icon').style.display = data.isSafe ? 'none' : 'block';

      const badge = document.createElement('span');
      badge.className = `risk-badge risk-${data.riskLevel}`;
      badge.textContent = `Risk: ${data.riskLevel}`;
      const wrap = document.getElementById('risk-badge-wrap');
      wrap.innerHTML = '';
      wrap.appendChild(badge);

      document.getElementById('r-attack-type').textContent = data.attackType || '—';
      document.getElementById('r-confidence').textContent  = `${data.confidenceScore ?? 0}%`;
      document.getElementById('r-confidence-bar').style.width = `${data.confidenceScore ?? 0}%`;

      const indicators = document.getElementById('r-indicators');
      indicators.innerHTML = (data.indicators || []).map(i => `<span class="tag">🔴 ${i}</span>`).join('') || '<span class="tag">None detected</span>';

      document.getElementById('r-explanation').textContent = data.explanation || '—';

      const actions = document.getElementById('r-actions');
      actions.innerHTML = (data.recommendedActions || []).map(a => `<li>${a}</li>`).join('') || '<li>No actions needed</li>';

      const elements = document.getElementById('r-elements');
      elements.innerHTML = (data.affectedElements || []).map(e => `<span class="tag">📌 ${e}</span>`).join('') || '<span class="tag">None</span>';

      const sev = data.severityBreakdown || {};
      document.getElementById('r-severity').innerHTML = `
        <div class="sev-item"><label>Urgency</label><span class="sev-${sev.urgency}">${sev.urgency || '—'}</span></div>
        <div class="sev-item"><label>Data Risk</label><span class="sev-${sev.dataRisk}">${sev.dataRisk || '—'}</span></div>
        <div class="sev-item"><label>Financial Risk</label><span class="sev-${sev.financialRisk}">${sev.financialRisk || '—'}</span></div>
      `;

      document.getElementById('r-raw').textContent = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
